spring.application.name=api-gateway
server.port=8080

# ✅ Routing hacia ms-inventario
spring.cloud.gateway.routes[0].id=ms-inventario
spring.cloud.gateway.routes[0].uri=http://ms-inventario:8081
spring.cloud.gateway.routes[0].predicates=Path=/api/v1/productos/**

# ✅ Routing hacia ms-usuarios
spring.cloud.gateway.routes[1].id=ms-usuarios
spring.cloud.gateway.routes[1].uri=http://ms-usuarios:8082
spring.cloud.gateway.routes[1].predicates=Path=/api/v1/usuarios/**

# ✅ CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*