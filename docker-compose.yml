# ==========================================
# GRUPO CORDILLERA - DOCKER COMPOSE
# ==========================================

services:
  # ==========================================
  # 1. BASE DE DATOS: INVENTARIO
  # ==========================================
  db-inventario:
    build: ./infra/db-inventario
    container_name: db-inventario
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_INVENTARIO_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_INVENTARIO_NAME}
      MARIADB_USER: ${DB_INVENTARIO_USER}
      MARIADB_PASSWORD: ${DB_INVENTARIO_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - inventario_data:/var/lib/mysql

  # ==========================================
  # 2. BASE DE DATOS: USUARIOS
  # ==========================================
  db-usuarios:
    build: ./infra/db-usuarios
    container_name: db-usuarios
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_USUARIOS_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_USUARIOS_NAME}
      MARIADB_USER: ${DB_USUARIOS_USER}
      MARIADB_PASSWORD: ${DB_USUARIOS_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - usuarios_data:/var/lib/mysql

  # ==========================================
  # 3. MICROSERVICIO: INVENTARIO
  # ==========================================
  ms-inventario:
    build: ./backend/ms_inventario
    container_name: ms-inventario
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://db-inventario:3306/${DB_INVENTARIO_NAME}
      DB_USER: ${DB_INVENTARIO_USER}
      DB_PASSWORD: ${DB_INVENTARIO_PASSWORD}
      SPRING_DATASOURCE_USERNAME: ${DB_INVENTARIO_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_INVENTARIO_PASSWORD}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    depends_on:
      - db-inventario

  # ==========================================
  # 4. MICROSERVICIO: USUARIOS
  # ==========================================
  ms-usuarios:
    build: ./backend/ms_usuarios
    container_name: ms-usuarios
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://db-usuarios:3306/${DB_USUARIOS_NAME}
      DB_USER: ${DB_USUARIOS_USER}
      DB_PASSWORD: ${DB_USUARIOS_PASSWORD}
      SPRING_DATASOURCE_USERNAME: ${DB_USUARIOS_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_USUARIOS_PASSWORD}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    depends_on:
      - db-usuarios

  # ==========================================
  # 5. API GATEWAY (Configuración Forzada Nivel Dios)
  # ==========================================
  api-gateway:
    build: ./backend/api_gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8080
      
      # Enrutamiento explícito para ms-inventario
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: ms-inventario
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://ms-inventario:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/v1/productos/**
      
      # Enrutamiento explícito para ms-usuarios
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: ms-usuarios
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://ms-usuarios:8082
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/v1/usuarios/**
      
      # Configuración de CORS Global desde las variables
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWED_HEADERS: "*"
    depends_on:
      - ms-inventario
      - ms-usuarios

  # ==========================================
  # 6. FRONTEND (legacy)
  # ==========================================
  frontend:
    build: ./frontend/frontend_legacy
    container_name: frontend_react
    ports:
      - "3000:80" 
    depends_on:
      - api-gateway
      
volumes:
  inventario_data:
  usuarios_data: