spring.application.name=ms-usuarios

# Datasource
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/bd_cordillera_usuarios}
spring.datasource.username=${DB_USUARIOS_USER:root}
spring.datasource.password=${DB_USUARIOS_PASSWORD:root}

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8082  

server.servlet.context-path=/api/v1